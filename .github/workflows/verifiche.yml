# Verifiche a ogni push su main: build, prove nel browser (npm test) e rapporto di verifica sulla mappa.
# Quando finisce verde, pages.yml pubblica su GitHub Pages il commit verificato; se finisce rosso il sito resta com'era.
name: Verifiche

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Una serie alla volta, e quella in corso finisce sempre: da lei dipende la pubblicazione. Con i push continui, se
# ogni push annullasse la serie precedente non ne finirebbe quasi nessuna e il sito resterebbe fermo. I push arrivati
# nel frattempo aspettano in un posto solo: resta l'ultimo, gli altri risultano annullati senza essere partiti.
concurrency:
  group: verifiche-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    # le prove durano da 25 a 31 minuti: il limite è il doppio, perché una serie lenta non finisca rossa, e senza
    # pubblicazione, per il tempo (ogni prova ha il suo tempo massimo: tempoMassimo in tests/gioco.js)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # senza chiavi PostHog: le prove non mandano eventi (il setup delle prove compila comunque senza)
      - run: npm run build
      - name: Chromium di Playwright (in cache per versione)
        id: pw
        run: echo "versione=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: cache-pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versione }}
      - if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.cache-pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test
      # rapporto della mappa nel gioco e, se una prova fallisce, quello che Playwright ha raccolto
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: risultati-prove
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # La mappa del commit deve essere quella che la build produce dai dati in data/, nell'ambiente fissato: la stessa
  # immagine di scripts/rigenera_mappa.sh e le librerie di scripts/requirements-mappa.txt. Gira accanto alle prove,
  # che durano di più: non allunga la serie.
  rigenera:
    runs-on: ubuntu-latest
    container: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: pip install --disable-pip-version-check --root-user-action=ignore --require-hashes -r scripts/requirements-mappa.txt
      - run: python scripts/rigenera_mappa.py --controlla

  # Prova della località (#139): rigenerata con i cambi di data/localita.json (la larghezza di un arco, la quota di un
  # nodo), la mappa e la posa dell'arredo cambiano solo entro il raggio dichiarato da ognuno; il resto deve restare
  # quello del repository byte per byte, tranne i casi di data/eccezioni/localita.json. Stessa immagine di "rigenera",
  # accanto alle prove.
  localita:
    runs-on: ubuntu-latest
    container: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: pip install --disable-pip-version-check --root-user-action=ignore --require-hashes -r scripts/requirements-mappa.txt
      - run: python scripts/rigenera_mappa.py --localita --uscita .localita/padova-map.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node scripts/posa_arredo.mjs --localita --mappa .localita/padova-map.json

  mappa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-mappa.txt
      # le stesse librerie della rigenerazione: i numeri del rapporto non cambiano con la versione di shapely
      - run: pip install --require-hashes -r scripts/requirements-mappa.txt
      - run: python3 scripts/verifica_mappa.py --elenco --json rapporto-mappa.json
      # il risolutore dei cavalcavia su due strutture piccole, senza rigenerare la mappa: le regole di #125
      - run: python3 scripts/prova_risolutore.py --controlla
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapporto-mappa
          path: rapporto-mappa.json
          if-no-files-found: ignore
          retention-days: 14
