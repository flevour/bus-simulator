# Compila il gioco con Vite e lo pubblica su GitHub Pages.
# Una tantum, nel repository: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Pubblica solo da main: l'ambiente github-pages accetta deploy soltanto da quel ramo.
# Parte quando il workflow Verifiche (verifiche.yml) finisce su main e pubblica il commit che ha verificato, solo se
# è finito verde: un push con una prova rossa lascia il sito com'era. A mano (Run workflow) pubblica la testa di main
# senza aspettare le verifiche: serve solo per un'emergenza.
name: Pubblica su GitHub Pages

on:
  workflow_run:
    workflows: [Verifiche]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# una sola pubblicazione alla volta; quella in corso non viene interrotta
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # verifiche rosse o annullate: l'esecuzione resta nell'elenco come saltata e il sito non cambia
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # il commit verificato, non la testa di main, che intanto può essere andata avanti
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # statistiche PostHog: variabili del repository (Settings → Secrets and variables → Actions → Variables).
      # Il token del progetto è pubblico per natura (finisce nel JavaScript del sito); senza variabili PostHog è spento.
      - run: npm run build
        env:
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
